# Local full stack: app + PostgreSQL (+ optional mail catcher). Not for production.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app-local-only   # local development only
      POSTGRES_DB: app
    ports: ["5432:5432"]
    volumes: [db-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app"]
      interval: 5s
      retries: 10
  mail:
    image: axllent/mailpit:latest     # catches all outgoing email at http://localhost:8025
    ports: ["8025:8025", "1025:1025"]
  app:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://app:app-local-only@db:5432/app
      SMTP_URL: smtp://mail:1025
    ports: ["3000:3000"]
    depends_on:
      db: { condition: service_healthy }
volumes:
  db-data:
