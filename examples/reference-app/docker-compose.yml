services:
  app:
    build: .
    ports: ["3000:3000"]
    environment:
      NODE_ENV: production
      PUBLIC_ORIGIN: http://localhost:3000
      LOG_LEVEL: info
    volumes:
      - tasklane-data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/healthz"]
      interval: 15s
      timeout: 3s
      retries: 3
    restart: unless-stopped
volumes:
  tasklane-data:
